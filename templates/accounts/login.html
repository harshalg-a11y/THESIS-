{% extends "base.html" %}
{% block title %}Sign In — Thesis Portal{% endblock %}
{% block content %}
<div class="form-wrapper">
  <div class="form-card">
    <h2>Welcome back</h2>
    <p class="form-subtitle">Sign in to your Thesis Portal account</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button class="btn" type="submit">Sign In</button>
      </div>
    </form>
    <p class="form-footer">Don't have an account? <a href="/accounts/register/">Create one</a></p>
  </div>
</div>
{% endblock %}
