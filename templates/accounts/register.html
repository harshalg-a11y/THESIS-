{% extends "base.html" %}
{% block title %}Create Account — Thesis Portal{% endblock %}
{% block content %}
<div class="form-wrapper">
  <div class="form-card">
    <h2>Create your account</h2>
    <p class="form-subtitle">Join Thesis Portal and get started today</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button class="btn" type="submit">Create Account</button>
      </div>
    </form>
    <p class="form-footer">Already have an account? <a href="/accounts/login/">Sign in</a></p>
  </div>
</div>
{% endblock %}
