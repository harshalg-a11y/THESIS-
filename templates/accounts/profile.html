{% extends "base.html" %}
{% block title %}Profile — Thesis Portal{% endblock %}
{% block content %}

<div class="page-header fade-in">
  <h2><i class="fa-solid fa-user-circle" style="margin-right:10px;"></i>Your Profile</h2>
</div>

<div style="max-width:600px;" class="fade-in delay-1">
  <div class="card">
    <!-- Avatar placeholder -->
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--glass-border);">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--grad-main);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900;flex-shrink:0;">
        {{ user.username|first|upper }}
      </div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;color:var(--text-base);">{{ user.username }}</div>
        <div style="font-size:0.82rem;color:var(--text-muted);text-transform:capitalize;margin-top:2px;">{{ user.role }}</div>
      </div>
    </div>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" style="width:100%;margin-top:8px;justify-content:center;">
        <i class="fa-solid fa-floppy-disk"></i> Save Changes
      </button>
    </form>
  </div>
</div>

{% endblock %}
