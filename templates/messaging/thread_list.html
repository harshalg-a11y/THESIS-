{% extends "base.html" %}
{% block content %}
<h2>Your Threads</h2>
<div class="card-list">
  {% for thread in threads %}
  <div class="card">
    <a href="/messages/{{ thread.id }}/">{{ thread.subject }}</a>
  </div>
  {% empty %}
  <div class="card">No threads yet.</div>
  {% endfor %}
</div>
{% endblock %}
